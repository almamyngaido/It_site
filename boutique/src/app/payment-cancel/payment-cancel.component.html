<div class="payment-page">
    <div class="container">
        <div class="payment-card">
            <div class="icon-container cancelled">
                <i class="bi bi-x-octagon"></i>
            </div>

            <h2>Paiement annulé</h2>

            <p class="cancel-message">
                Vous avez annulé le processus de paiement. Votre commande n'a pas été validée.
            </p>

            <p class="info-message">
                Aucun montant n'a été débité de votre compte. Vous pouvez retourner à votre panier pour terminer votre commande ou continuer vos achats.
            </p>

            <div class="actions">
                <button class="btn btn-primary" (click)="returnToCart()">
                    <i class="bi bi-cart3 me-2"></i>
                    Retourner au panier
                </button>
                <button class="btn btn-outline-primary" (click)="continueShopping()">
                    <i class="bi bi-bag me-2"></i>
                    Continuer mes achats
                </button>
                <button class="btn btn-outline-secondary" (click)="goHome()">
                    <i class="bi bi-house me-2"></i>
                    Retour à l'accueil
                </button>
            </div>
        </div>
    </div>
</div>
